<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="site-nav-list">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <ul id="site-nav-list" class="nav-list">
        {%- for item in site.nav -%}
        <li><a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active" aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {%- endfor -%}
        <li><a href="https://www.aramislab.fr" target="_blank" rel="noopener">ARAMIS Lab</a></li>
      </ul>
    </nav>
    <button class="theme-toggle" aria-label="Toggle colour theme" title="Toggle light / dark theme">
      <svg class="icon icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="12" r="5" fill="currentColor"/>
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="1.5" x2="12" y2="3.5"/>
          <line x1="12" y1="20.5" x2="12" y2="22.5"/>
          <line x1="1.5" y1="12" x2="3.5" y2="12"/>
          <line x1="20.5" y1="12" x2="22.5" y2="12"/>
          <line x1="4.6" y1="4.6" x2="6" y2="6"/>
          <line x1="18" y1="18" x2="19.4" y2="19.4"/>
          <line x1="4.6" y1="19.4" x2="6" y2="18"/>
          <line x1="18" y1="6" x2="19.4" y2="4.6"/>
        </g>
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/>
      </svg>
    </button>
  </div>
</header>
