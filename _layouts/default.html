<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    (function () {
      document.documentElement.classList.add('js');
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/files/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/files/favicon-192.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/files/favicon-180.png' | relative_url }}">
</head>
<body>
  {%- include header.html -%}
  <main id="content" class="wrap">
    {{ content }}
  </main>
  {%- include footer.html -%}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
